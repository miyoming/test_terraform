
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: backend
  - group: var


stages:
- stage: tfvalidate
  jobs:
  - job: Keyvault
    steps:
    - task: AzureKeyVault@2
      displayName: Fetch keyvault
      inputs:
        azureSubscription: 'test_terraform'
        KeyVaultName: 'miyoming-keyvault'
        SecretsFilter: '*'
        RunAsPreJob: true

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.15.9'

    - task: TerraformTask@5
      displayName: Terraform init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'test_terraform'
        backendAzureRmResourceGroupName: '$(strgrg)'
        backendAzureRmStorageAccountName: '$(stgacct)'
        backendAzureRmContainerName: '$(stgcont)'
        backendAzureRmKey: '$(stgkey)'

    - task: TerraformTask@5
      displayName: Terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'

    - task: TerraformTask@5
      displayName: Terraform plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'test_terraform'
      env:
        TF_VAR_nsg_name: $(nsg_name)
        
        TF_VAR_nsg_rules: $(nsg_rules)
        
        
#         |
#          [
#            {
#              "name": "allow-incoming-traffic",
#              "priority": 100,
#              "direction": "Inbound",
#              "access": "Allow",
#              "protocol": "*",
#              "source_port_range": "*",
#              "destination_port_range": "*",
#              "source_address_prefix": "*",
#              "destination_address_prefix": "*"
 #           },
 #         ]


- stage: tfapply
  dependsOn: tfvalidate
  condition: succeeded('tfvalidate')
  jobs:
  - job: apply_now
    steps:

      - task: AzureKeyVault@2
        displayName: Fetch keyvault
        inputs:
          azureSubscription: 'test_terraform'
          KeyVaultName: 'miyoming-keyvault'
          SecretsFilter: '*'
          RunAsPreJob: true


      - task: TerraformInstaller@1
        displayName: Terraform init
        inputs:
          terraformVersion: '1.15.9'

      - task: TerraformTask@5
        displayName: Terraform init
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'test_terraform'
          backendAzureRmResourceGroupName: '$(strgrg)'
          backendAzureRmStorageAccountName: '$(stgacct)'
          backendAzureRmContainerName: '$(stgcont)'
          backendAzureRmKey: '$(stgkey)'

      - task: TerraformTask@5
        displayName: Terraform apply
        inputs:
          provider: 'azurerm'
          command: 'apply'
          environmentServiceNameAzureRM: 'test_terraform'
        env:
          TF_VAR_nsg_name: $(nsg_name)
          TF_VAR_nsg_rules: $(nsg_rules)